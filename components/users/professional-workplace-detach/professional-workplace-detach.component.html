<h2 mat-dialog-title>Desvincular local de trabalho</h2>

<mat-dialog-content>
  <p>
    Você deseja realmente desvincular o local de trabalho <strong>{{ workplaceName }}</strong> do profissional <strong>{{ professionalName }}</strong>?
  </p>
  <p class="warning-text">
    Esta ação removerá a associação atual entre o profissional e o local de trabalho.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button 
    mat-button 
    type="button" 
    [mat-dialog-close]="false" 
    [disabled]="isSubmitting()">
    Cancelar
  </button>

  <button 
    mat-flat-button 
    color="warn" 
    type="button" 
    [disabled]="isSubmitting()" 
    (click)="onSubmit()">
    <div class="waiting">
      @if (isSubmitting()) {
        <mat-spinner [diameter]="20"></mat-spinner>
      }
      <span>{{ isSubmitting() ? 'Desvinculando...' : 'Confirmar Desvínculo' }}</span>
    </div>
  </button>
</mat-dialog-actions>
