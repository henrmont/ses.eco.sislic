<h2 mat-dialog-title>Locais de trabalho do profissional</h2>

<mat-dialog-content>
  <div class="workplaces-container">

    @if (isLoading()) {
      <div class="loading-shade">
        <mat-spinner [diameter]="40"></mat-spinner>
      </div>
    } @else {
      <div class="table">
        <table mat-table [dataSource]="dataSource">
            
          <!-- Entidade Orçamentária -->
          <ng-container matColumnDef="budget_entity">
            <th mat-header-cell *matHeaderCellDef> Entidade Orçamentária </th>
            <td mat-cell *matCellDef="let element">
              {{ (element.budget_entity | mask: '00.000') || 'Não informada' }}
            </td>
          </ng-container>

          <!-- Nome / Local -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element">
              {{ element.workplace?.name || element.name || 'Não informado' }}
            </td>
          </ng-container>

          <!-- Ações -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="center"> Ações </th>
            <td mat-cell *matCellDef="let element" class="center actions-cell">
              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Desvincular local de trabalho" 
                (click)="professionalWorkplaceDetach(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Estado Vazio -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
              <p>Nenhum local de trabalho vinculado a este profissional.</p>
            </td>
          </tr>
        </table>
      </div>
    }

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Fechar</button>
  <button mat-flat-button color="primary" type="button" (click)="professionalWorkplaceAttach()">
    <mat-icon>add</mat-icon>
    Vincular
  </button>
</mat-dialog-actions>
