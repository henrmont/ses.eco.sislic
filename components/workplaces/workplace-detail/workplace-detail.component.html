<h2 mat-dialog-title>Detalhes do Local de Trabalho</h2>

<mat-dialog-content>
  <div class="details-container">
    
    <!-- DADOS PRINCIPAIS -->
    <mat-card appearance="outlined" class="detail-card">
      <mat-card-header>
        <mat-card-subtitle>DADOS PRINCIPAIS</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="line cols-1-col">
          <div>
            <strong>Unidade Orçamentária:</strong>
            @if (workplace?.budget_entity; as budgetVal) {
              {{ budgetVal | mask: '00.000' }}
            } @else {
              Não informada
            }
          </div>
        </div>
        <div class="line cols-1-col">
          <div>
            <strong>Nome do Local:</strong> {{ workplace?.name || 'Não informado' }}
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- HIERARQUIA ORGANIZACIONAL -->
    <mat-card appearance="outlined" class="detail-card">
      <mat-card-header>
        <mat-card-subtitle>HIERARQUIA ORGANIZACIONAL</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="line cols-1-col">
          <div>
            <strong>Unidade Superior:</strong> {{ parentName }}
          </div>
        </div>
      </mat-card-content>
    </mat-card>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">
    Fechar
  </button>
</mat-dialog-actions>
